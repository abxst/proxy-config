name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-version:
    name: Validate SemVer
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate version file and release tag
        id: version
        shell: bash
        run: |
          version=$(tr -d '\r\n' < VERSION)
          core='(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)'
          identifier='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          tag_pattern="^v${core}(-${identifier}(\.${identifier})*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$"
          if [[ ! "$version" =~ ^${core}$ ]]; then
            echo "::error::VERSION must contain a valid MAJOR.MINOR.PATCH without a leading v or leading zeroes."
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ $tag_pattern ]]; then
              echo "::error::Tag is not SemVer 2.0.0 with a leading v: $GITHUB_REF_NAME"
              exit 1
            fi
            tagged_version="${GITHUB_REF_NAME#v}"
            tagged_version="${tagged_version%%[-+]*}"
            if [[ "$tagged_version" != "$version" ]]; then
              echo "::error::Tag version $tagged_version differs from VERSION $version."
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build-test-publish:
    name: Windows ${{ matrix.configuration }} build, test and package
    needs: validate-version
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ProxyConfig.sln

      - name: Build
        run: dotnet build ProxyConfig.sln --configuration ${{ matrix.configuration }} --no-restore

      - name: Test
        run: dotnet test ProxyConfig.sln --configuration ${{ matrix.configuration }} --no-build --logger "trx;LogFileName=tests.trx"

      - name: Publish Windows x64
        run: dotnet publish src/ProxyConfig.App/ProxyConfig.App.csproj --configuration ${{ matrix.configuration }} --runtime win-x64 --self-contained false --output artifacts/${{ matrix.configuration }}/win-x64

      - name: Package ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Compress-Archive -Path "artifacts/${{ matrix.configuration }}/win-x64/*" -DestinationPath "release-assets/ProxyConfig-${{ matrix.configuration }}-win-x64.zip" -CompressionLevel Optimal

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: proxy-config-${{ matrix.configuration }}-win-x64
          path: release-assets/*.zip
          if-no-files-found: error

  github-release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [validate-version, build-test-publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packaged builds
        uses: actions/download-artifact@v4
        with:
          pattern: proxy-config-*-win-x64
          path: release-assets
          merge-multiple: true

      - name: Publish automatic Debug pre-release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: v${{ needs.validate-version.outputs.version }}-debug.${{ github.run_number }}.${{ github.run_attempt }}
        run: |
          gh release create "$RELEASE_TAG" release-assets/*.zip \
            --target "$GITHUB_SHA" \
            --title "Proxy Config $RELEASE_TAG" \
            --prerelease \
            --notes "Automated build from main at $GITHUB_SHA. Includes Debug and Release Windows x64 ZIP packages. Requires .NET 10 Desktop Runtime."

      - name: Publish tagged stable release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          release_flags=()
          tag_version="${GITHUB_REF_NAME%%+*}"
          if [[ "$tag_version" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" release-assets/*.zip \
            --verify-tag \
            --title "Proxy Config $GITHUB_REF_NAME" \
            --generate-notes "${release_flags[@]}"
